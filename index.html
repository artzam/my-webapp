<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Aplikasi Google Sheet DB</title>
</head>
<body>
  <h2>Borang Pendaftaran</h2>
  <input type="text" id="nama" placeholder="Nama">
  <input type="email" id="email" placeholder="Email">
  <button onclick="hantarData()">Hantar</button>

  <h3>Data Sedia Ada:</h3>
  <pre id="paparanData">Memuatkan data...</pre>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzOHRSF-QvFfTEUY7NZCdXsYluw2XXYqQfYTjddsw3rSPd6FzS1F65nX2SeEOi7O-xY/exec";

    // Ambil Data (GET)
    async function ambilData() {
      let res = await fetch(API_URL);
      let data = await res.json();
      document.getElementById('paparanData').innerText = JSON.stringify(data, null, 2);
    }

    // Hantar Data (POST)
    async function hantarData() {
      let nama = document.getElementById('nama').value;
      let email = document.getElementById('email').value;

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ nama: nama, email: email })
      });

      alert("Data berjaya dihantar!");
      ambilData(); // Kemaskini senarai
    }

    ambilData();
  </script>
</body>
</html>
